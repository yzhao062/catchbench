name: Verify

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.10"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and test runner
        run: python -m pip install -e ".[dev]" pytest
      # The named-value contract tests import catchbench.namedvalue, which needs GRADE's
      # experiment/ modules. Those are not in GRADE's wheel, so the checkout bridge is the only
      # way to get them. Importing costs no download: the corpus fetch lives inside a function.
      # The commit is pinned so a GRADE change cannot silently alter this repository's CI.
      - name: Install GRADE (pinned, for the named-value tests)
        run: |
          git clone --filter=blob:none https://github.com/yzhao062/grade.git ../grade
          git -C ../grade checkout --quiet 3839a57ac165d58a807fce0a3ff38346732ee936
          python -m pip install -e "../grade[experiments]"
      # A contract that quietly stops running is the failure this repository has to notice, so both
      # runs below are checked against tests/expected_tests.txt, the committed list of node ids
      # this repository claims to run. tools/check_test_report.py carries the reasoning. The short
      # version: every earlier version of this check read pytest's terminal summary, an adversarial
      # review broke that shape eight ways, and six of the eight were the suite telling the check
      # what it wanted to hear, because the summary is written by the process the suite configures.
      # The junit-xml report names every node id with its outcome as an element rather than as a
      # count, the manifest says which node ids must be there, and the comparison runs in both
      # directions, so a missing contract is as loud as a failing one.
      #   -o junit_family=xunit1: the xunit2 family drops the per-testcase `file` attribute, which
      #     is what makes a node id reconstructable from the report.
      #   -o addopts=: this job runs with the flags written here and not with whatever a
      #     pyproject.toml addopts entry adds. PYTEST_ADDOPTS in the environment would still apply,
      #     and setting it means editing this file, which a reviewer sees.
      # The pytest exit status is held and re-raised after the check, so a failing run still fails
      # the step and the check still gets to say what it saw.
      - name: Test with hash seed 0
        shell: bash
        env:
          PYTHONHASHSEED: "0"
          GRADE_DIR: ${{ github.workspace }}/../grade
        run: |
          rm -f seed0.xml
          status=0
          pytest tests -q -ra --junit-xml=seed0.xml -o junit_family=xunit1 -o addopts= || status=$?
          python tools/check_test_report.py --report seed0.xml
          exit "$status"
      - name: Test with hash seed 1
        shell: bash
        env:
          PYTHONHASHSEED: "1"
          GRADE_DIR: ${{ github.workspace }}/../grade
        run: |
          rm -f seed1.xml
          status=0
          pytest tests -q -ra --junit-xml=seed1.xml -o junit_family=xunit1 -o addopts= || status=$?
          python tools/check_test_report.py --report seed1.xml
          exit "$status"

  # The PyGOD truncation regression is invisible from the board: the detector scored the first node
  # of each chunk and left the rest at zero, and the board read that as a detector ranking nothing.
  # Its test needs torch, which the matrix above does not carry, so this job carries it instead.
  # Without this job the test would skip in every CI run and lock nothing.
  graph-ad:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      # CPU wheels only: the default PyPI torch for Linux is the CUDA build, several gigabytes of
      # download for a test that never touches a device. torch goes in first so torch-geometric and
      # pygod resolve against the build already present rather than pulling the CUDA one.
      #
      # The torch version is pinned rather than floated because pip's torch-geometric is the pure
      # Python layer only. PyGOD's DOMINANT samples through NeighborLoader, which needs the compiled
      # pyg-lib backend, and those wheels live on a separate index that lags the torch release: on
      # 2026-08-18 the CPU index already carried torch 2.13.0 while data.pyg.org carried nothing for
      # it. Floating torch would leave this job green until the next torch release and red after.
      - name: Install the graph-AD stack (CPU wheels, pinned to a torch pyg-lib publishes for)
        env:
          TORCH_VERSION: "2.12.1"
        run: |
          python -m pip install "torch==${TORCH_VERSION}" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install pyg_lib -f "https://data.pyg.org/whl/torch-${TORCH_VERSION}+cpu.html"
          python -m pip install -e ".[graph-ad,dev]"
      # A stack that half-installed would surface as an ImportError inside a test rather than as a
      # setup failure, so the versions are printed and the backend import is asserted here.
      - name: Report the resolved stack
        run: |
          python -c "import torch, torch_geometric, pyg_lib, pygod; print('torch', torch.__version__); print('torch_geometric', torch_geometric.__version__); print('pyg_lib', pyg_lib.__version__); print('pygod', pygod.__version__)"
          python -c "import torch_geometric.typing as t; assert t.WITH_PYG_LIB, 'pyg-lib did not register; NeighborSampler would fail'; print('pyg-lib backend registered')"
      # --runxfail is what makes this job an enforcement rather than a formality. Without it an
      # xfail marker on these tests passes both dependency sets and enforces nothing: in the matrix
      # job above the stack is missing, so skipif wins and the result is a declared skip, while
      # here the stack is present and the four results arrive as XPASS, which a SKIPPED-only grep
      # never sees. With --runxfail every assertion runs and reports its real outcome, so a broken
      # graph contract fails here even if someone marks the file xfail somewhere else.
      #
      # --require-pass is the other half: the four node ids the manifest declares for this file
      # must each report `passed` here. That is stricter than the grep it replaces, which read the
      # terminal and so could be blinded by --no-summary while the file skipped in full.
      - name: Run the graph-AD contract
        shell: bash
        run: |
          rm -f graph_ad.xml
          status=0
          pytest tests/test_graph_ad_scores_every_node.py -q -ra --runxfail --color=no \
            --junit-xml=graph_ad.xml -o junit_family=xunit1 -o addopts= || status=$?
          python tools/check_test_report.py --report graph_ad.xml \
            --only tests/test_graph_ad_scores_every_node.py --require-pass
          exit "$status"

  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package
        run: python -m pip install -e .
      - name: Run offline smoke check
        run: python tools/ci_smoke.py
      # ci_smoke.py builds the PRE task directly and asserts the corpus counts and the two floors.
      # It never runs the CLI, so it would not notice `--task pre` breaking, and that path is the
      # first command the README gives a newcomer. This job has no GRADE checkout and no corpora,
      # which is exactly the environment the path claims to work in, so running it here proves the
      # claim rather than restating it. Roughly two seconds.
      - name: Score the PRE board through the documented offline command
        shell: bash
        run: |
          set -o pipefail
          python run.py --task pre | tee pre.txt
          # Every scored line must already appear in the committed board. A drift in the PRE board,
          # or a fast path that quietly stops agreeing with the full run, fails here.
          python - <<'PY'
          import pathlib, sys
          golden = set(l.rstrip() for l in
                       pathlib.Path("tests/golden/board.txt").read_text(encoding="utf-8").split("\n"))
          scored = [l.rstrip() for l in pathlib.Path("pre.txt").read_text(encoding="utf-8").split("\n")
                    if l.startswith("  ") and any(c.isdigit() for c in l)]
          missing = [l for l in scored if l not in golden]
          print(f"{len(scored)} scored line(s); {len(missing)} absent from the golden board")
          if not scored:
              sys.exit("the PRE command scored nothing, so this check proved nothing")
          for line in missing:
              print("MISSING:", line)
          sys.exit(1 if missing else 0)
          PY

  cache-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Validate prediction caches
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          # legacy_run_keys.json shares the directory but is a key map, not a prediction cache. It
          # gets its own contract below rather than an exemption, because a duplicate value in it
          # would silently point two legacy keys at one canonical record.
          legacy_path = Path("data/llm_judge/legacy_run_keys.json")
          post_paths = [p for p in sorted(Path("data/llm_judge").glob("*.json")) if p != legacy_path]
          pre_paths = sorted(Path("data/pre/llm_judge_method").glob("*.json"))
          assert post_paths, "no POST prediction caches found"
          assert pre_paths, "no PRE prediction caches found"
          assert legacy_path.exists(), "the legacy key map is missing; cached runs would not resolve"

          for path in post_paths:
              root = json.loads(path.read_text(encoding="utf-8"))
              assert isinstance(root, dict), f"{path}: root must be an object"
              predictions = root.get("predictions")
              assert isinstance(predictions, dict), f"{path}: missing predictions object"
              for run_id, prediction in predictions.items():
                  assert isinstance(prediction, dict), f"{path}: {run_id} must be an object"
                  assert {"top", "ranking", "raw"} <= prediction.keys(), (
                      f"{path}: {run_id} lacks a scoring field"
                  )
                  top = prediction["top"]
                  assert top is None or isinstance(top, int), f"{path}: {run_id} has invalid top"
                  assert isinstance(prediction["ranking"], list), (
                      f"{path}: {run_id} has invalid ranking"
                  )
                  assert all(isinstance(i, int) for i in prediction["ranking"]), (
                      f"{path}: {run_id} ranking entries must be integers"
                  )
                  assert isinstance(prediction["raw"], str), f"{path}: {run_id} has invalid raw"

          legacy = json.loads(legacy_path.read_text(encoding="utf-8"))
          assert isinstance(legacy.get("format"), str), f"{legacy_path}: missing format"
          keys = legacy.get("keys")
          assert isinstance(keys, dict) and keys, f"{legacy_path}: missing keys object"
          assert all(isinstance(k, str) and isinstance(v, str) for k, v in keys.items()), (
              f"{legacy_path}: every entry must map text to text"
          )
          assert len(set(keys.values())) == len(keys), (
              f"{legacy_path}: two legacy keys resolve to one canonical record"
          )

          for path in pre_paths:
              predictions = json.loads(path.read_text(encoding="utf-8"))
              assert isinstance(predictions, dict), f"{path}: root must be an object"
              for instance_id, needed in predictions.items():
                  assert isinstance(instance_id, str), f"{path}: instance id must be text"
                  assert isinstance(needed, list), f"{path}: {instance_id} must be a list"
                  assert all(isinstance(name, str) for name in needed), (
                      f"{path}: {instance_id} entries must be text"
                  )

          print(
              f"validated {len(post_paths)} POST caches, {len(pre_paths)} PRE caches, "
              f"and {len(keys)} legacy key mappings"
          )
          PY
