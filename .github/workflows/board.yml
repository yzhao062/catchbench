name: Board

# The scoring board produces the paper's board-derived numbers, and verify.yml does not cover them:
# it checks the PRE board through ci_smoke.py and skips POST, LIVE, and Gold, because those need the
# GRADE bridge and three corpus downloads. This workflow runs the whole board and compares it against
# tests/golden/board.txt. It does not cover the paper's other tables, which come from named tools of
# their own (statistical_tests.py, whoandwhen_split_report.py, pre_merge_judges.py,
# gold_artifact_diagnostic.py) or are read from the committed records.
#
# 2026-08-22: this job ran on a self-hosted ARM64 runner and had therefore never run at all. No
# runner was ever registered, so every dispatch sat queued until a later push cancelled it or until
# GitHub expired it at twenty-four hours. The visible history was four cancellations and no
# execution. A workflow that exists and never runs is worse than an absent one, because a reader who
# opens .github/workflows/ sees this file and its comments and concludes the board is checked.
#
# It now runs on a GitHub-hosted runner, which costs two things the self-hosted machine gave for
# free. The three corpora, about 320 MB, are fetched on every run rather than once. And the PyGOD
# rows run on CPU rather than on a GPU, which is slower but produces the same scores; nothing on this
# board depends on a device. Caching the corpus download is worth doing if the run time becomes
# annoying: the revisions are pinned, so the cache key is stable. It is left out for now because a
# cache that silently stops matching is the failure this repository keeps finding, and the job runs
# at most a few times a week.
#
# It lives in its own file rather than as a job in verify.yml because it takes tens of minutes
# against verify.yml's ninety seconds, so the two belong on different cadences.
#
# The trigger set stays narrow. That was a security requirement while the runner was self-hosted,
# since a fork's pull request can change the workflow and the code a maintainer's machine then runs.
# On a hosted runner that reason is gone and the remaining one is cost: this job is long, and running
# it on every pull request would buy little that the golden comparison on main does not already give.

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tools/**"
      - "data/**"
      - "run.py"
      - "pyproject.toml"
      - "tests/golden/**"
      - ".github/workflows/board.yml"
  schedule:
    # Weekly, so a corpus that moves upstream surfaces even with no commits. The preflight in
    # corpora.py fails loudly in that case, which is the intended outcome rather than a silent
    # rescore.
    - cron: "41 6 * * 2"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # The board is long, so a burst of pushes should not queue several full runs behind each other.
  group: board-${{ github.ref }}
  cancel-in-progress: true

jobs:
  board:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      # CPU wheels only, and the torch version pinned rather than floated, for the reason the
      # graph-AD job in verify.yml carries in full: pip's torch-geometric is the pure Python layer,
      # PyGOD samples through NeighborLoader, and the compiled pyg-lib backend lives on an index that
      # lags the torch release. Floating torch leaves this green until the next torch release and red
      # after. The pin is duplicated in verify.yml and tests/test_workflow_pins.py holds the two
      # equal, because a board scored against a different torch build than the contract tests use is
      # a difference nobody would look for.
      - name: Install the board stack (CPU wheels, pinned to a torch pyg-lib publishes for)
        env:
          TORCH_VERSION: "2.12.1"
        run: |
          python -m pip install "torch==${TORCH_VERSION}" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install pyg_lib -f "https://data.pyg.org/whl/torch-${TORCH_VERSION}+cpu.html"
          python -m pip install -e ".[full,dev]"

      # Assert the backend before spending the run, so a wrong wheel index fails in seconds with a
      # message naming the build rather than as an ImportError deep inside a board.
      - name: Report the resolved stack and refuse to score without a sampler backend
        run: |
          python -c "import platform, sys; print(platform.platform()); print(sys.version)"
          python -c "import torch, torch_geometric, pyg_lib, pygod; print('torch', torch.__version__); print('torch_geometric', torch_geometric.__version__); print('pyg_lib', pyg_lib.__version__); print('pygod', pygod.__version__)"
          python -c "import torch_geometric.typing as t; assert t.WITH_PYG_LIB, 'pyg-lib did not register; PyGOD would fail at the first row'; print('pyg-lib backend registered')"

      - name: Install GRADE (pinned, for the corpus loaders)
        run: |
          rm -rf ../grade-board
          git clone --filter=blob:none https://github.com/yzhao062/grade.git ../grade-board
          git -C ../grade-board checkout --quiet 3839a57ac165d58a807fce0a3ff38346732ee936
          python -m pip install -e "../grade-board[experiments]"

      # The board is computed once and then compared, rather than computed by the comparison and
      # computed again by the failure handler. The first version did the latter, and a drift turned a
      # 28-minute step into 47 minutes of runner time for an artifact the first run already had.
      - name: Score the board
        env:
          GRADE_DIR: ${{ github.workspace }}/../grade-board
          PYTHONHASHSEED: "0"
        run: python run.py > board-produced.txt

      # README tables, prose numbers, and claims run in verify.yml on every push and pull request.
      # Keep this tens-of-minutes workflow responsible only for the scoring board.
      - name: Compare the board against the golden
        run: python tools/check_board.py --produced board-produced.txt --board-only

      # The board prints the corpus revisions it scored, so keeping it means a mismatch can be read
      # without re-running anything.
      - name: Upload the produced board
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: board-produced
          path: board-produced.txt
          retention-days: 14
