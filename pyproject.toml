[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "catchbench"
version = "0.1.0"
description = "CatchBench: a benchmark for agent auditing across the PRE / LIVE / POST lifecycle."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "auditable>=0.2.0",
    "numpy",
    "scikit-learn",
    "networkx",
]

[project.optional-dependencies]
# The PyOD / PyGOD baselines need the AD stack; PyGOD also needs torch + a pyg-lib / torch-sparse
# backend matched to the torch build (install from the PyG wheel index).
graph-ad = ["pyod", "pygod", "torch", "torch-geometric"]
# run.py reaches GRADE's experiment loaders, which pull corpora from the Hub. These mirror GRADE's
# own [experiments] extra; prefer `pip install -e <grade-checkout>[experiments]` so versions track.
dev-seed = ["huggingface_hub", "pyarrow", "datasets"]
full = [
    "pyod",
    "pygod",
    "torch",
    "torch-geometric",
    "huggingface_hub",
    "pyarrow",
    "datasets",
]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]
